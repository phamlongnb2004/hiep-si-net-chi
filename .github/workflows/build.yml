# Tự động build file APK (Android) và .exe (Windows).
# Chạy khi bấm "Run workflow" trong tab Actions, hoặc khi đẩy tag dạng v1.0.0 (khi đó tạo luôn bản phát hành).
# Đặt địa chỉ máy chủ trong Settings → Secrets and variables → Actions → Variables, tên SERVER_URL.
name: Build game

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Ghép bản game với địa chỉ máy chủ
        run: node tools/build-client.js "${{ vars.SERVER_URL }}"
      - name: Chuẩn bị dự án Android
        working-directory: mobile
        run: |
          npm install
          npm run prepare-web
          npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/HiepSiNetChi.apk
      - uses: actions/upload-artifact@v4
        with: { name: HiepSiNetChi-android, path: out/HiepSiNetChi.apk }

  windows:
    name: EXE Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Ghép bản game với địa chỉ máy chủ
        run: node tools/build-client.js "${{ vars.SERVER_URL }}"
      - name: Build EXE
        working-directory: desktop
        shell: bash
        run: |
          npm install
          mkdir -p game
          cp ../public/index.html game/index.html
          cp icon.png game/icon.png
          npx electron-builder --win nsis portable --x64 --publish never -c.win.signAndEditExecutable=true
      - uses: actions/upload-artifact@v4
        with:
          name: HiepSiNetChi-windows
          path: desktop/dist/*.exe

  release:
    name: Tạo bản phát hành
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          body: |
            Tải file APK để cài trên Android, file setup.exe hoặc portable.exe cho Windows.
