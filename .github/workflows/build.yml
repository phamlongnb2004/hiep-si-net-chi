# Tự động đóng gói bản Windows mỗi lần cập nhật game và thay vào bản phát hành "moi-nhat".
# Trang tải game (/tai-game) luôn trỏ tới bản phát hành mới nhất nên link tự cập nhật.
# Bản Android (APK) mở thẳng máy chủ game nên tự có nội dung mới; file APK lấy từ release-files/.
name: Build game

on:
  push:
    branches: [main]
    paths: ['tools/**', 'desktop-lite/**', 'release-files/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-game
  cancel-in-progress: true

env:
  SERVER_URL: ${{ vars.SERVER_URL || 'https://hiep-si-net-chi.phamthanhlong-contact.workers.dev' }}

jobs:
  build:
    name: Đóng gói và phát hành
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Ghép bản game với địa chỉ máy chủ
        run: node tools/build-client.js "$SERVER_URL"
      - name: Đóng gói bản Windows (Neutralino, một file .exe)
        working-directory: desktop-lite
        run: |
          cp ../public/index.html resources/index.html
          npx -y @neutralinojs/neu@11 update
          npx -y @neutralinojs/neu@11 build --release --embed-resources
          mkdir -p ../out
          cd dist/HiepSiNetChi && zip -9 ../../../out/HiepSiNetChi-Windows.zip HiepSiNetChi-win_x64.exe
      - name: Thêm bản Android
        run: cp release-files/HiepSiNetChi.apk out/HiepSiNetChi.apk
      - name: Cập nhật bản phát hành "moi-nhat"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="Bản $(TZ=Asia/Bangkok date +'%d/%m/%Y %H:%M') · ${GITHUB_SHA::7}"
          NOTES="Tải bản mới nhất của Hiệp Sĩ Nét Chì. Trang tải: ${SERVER_URL}/tai-game"
          if gh release view moi-nhat >/dev/null 2>&1; then
            gh release upload moi-nhat out/HiepSiNetChi-Windows.zip out/HiepSiNetChi.apk --clobber
            gh release edit moi-nhat --title "$NAME" --notes "$NOTES" --latest
          else
            gh release create moi-nhat out/HiepSiNetChi-Windows.zip out/HiepSiNetChi.apk --title "$NAME" --notes "$NOTES" --latest
          fi
