<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quản trị Hiệp Sĩ Nét Chì</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="admin-fonts.css">
<style>
:root{--ink:#16224a;--ink2:#2b3a6b;--cream:#fffaf0;--paper:#fffdf8;--sky:#e6f3ff;--sun:#ffd23f;--sun2:#ff9f1c;--mint:#3ccf91;--red:#ff5d6c;--blue:#3aa8ff;--violet:#8b6cff;
  --muted:#5a6a95;--line:#dfe5f2;--disp:'Baloo 2','Nunito',system-ui,sans-serif;--body:'Nunito','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#14204a}
body{font:700 15px/1.45 var(--body);color:var(--ink);background:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 20%,rgba(255,255,255,0) 30%,rgba(10,30,70,.38) 100%),#4fb8ff url(tai-game-bg.webp) center 62%/cover no-repeat}
body.in::before{background:linear-gradient(rgba(14,24,58,.72),rgba(14,24,58,.82)),#14204a url(tai-game-bg.webp) center 62%/cover no-repeat}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:800;line-height:1.15}
a{color:#1f6fd1;font-weight:800}
.hidden{display:none!important}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
#root{position:relative}
/* logo giống trang tải game */
.logo{display:flex;flex-direction:column;align-items:center;line-height:.86;text-align:center;user-select:none}
.logo .l1,.logo .l2{position:relative;display:block;font-family:var(--disp);font-weight:800;letter-spacing:.5px}
.logo .o,.logo .f{display:block;white-space:nowrap}
.logo .o{position:absolute;inset:0;color:var(--ink);-webkit-text-stroke:var(--sw) var(--ink);text-shadow:0 5px 0 var(--ink),0 10px 18px rgba(10,30,80,.35)}
.logo .f{position:relative;color:var(--c1);text-shadow:0 -2px 0 var(--c0),0 3px 0 var(--c2)}
.logo .l1{--sw:11px;--c0:#fff6b8;--c1:#ffd23f;--c2:#ff9f1c;font-size:clamp(44px,9vw,72px)}
.logo .l2{--sw:10px;--c0:#fff;--c1:#8fdcff;--c2:#3aa8ff;font-size:clamp(34px,7vw,54px);margin-top:2px}
.ribbon{margin-top:10px;padding:4px 18px 3px;font:800 14px/1.2 var(--disp);letter-spacing:4px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);background:linear-gradient(#ff8a8a,#ff5d6c);border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink)}
.logo.sm .l1{--sw:6px;font-size:32px}.logo.sm .l2{--sw:5px;font-size:25px}.logo.sm .o{text-shadow:0 3px 0 var(--ink)}
.logo.sm .ribbon{font-size:10px;letter-spacing:3px;padding:2px 12px;margin-top:8px;border-width:2px;box-shadow:0 3px 0 var(--ink)}
/* thẻ kem */
.card{position:relative;background:rgba(255,250,240,.97);border:4px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--ink),0 18px 36px rgba(10,30,80,.28);padding:20px clamp(14px,2.4vw,24px)}
.card::before{content:"";position:absolute;inset:6px;border:2px dashed rgba(22,34,74,.13);border-radius:18px;pointer-events:none}
.card>h2{font-size:21px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h3{font-size:16px;margin:14px 0 8px}
.badge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);color:#fff;flex:none}
.badge svg.i{width:18px;height:18px;stroke-width:2.6}
.c-sun{background:linear-gradient(#ffe37a,#ffb21c);color:var(--ink)}.c-mint{background:linear-gradient(#8ff0c0,#2fb77a)}.c-sky{background:linear-gradient(#8fd8ff,#2f8fe0)}
.c-red{background:linear-gradient(#ff9aa4,#e8475a)}.c-vio{background:linear-gradient(#c0afff,#7a5cf0)}.c-ink{background:linear-gradient(#5a6c9e,#2b3a6b)}
/* đăng nhập */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px 16px}
.login .card{width:min(440px,100%);display:flex;flex-direction:column;gap:14px;padding:24px 26px 26px}
.login .card>h2{justify-content:center;font-size:25px;margin:0}
.login .lock{position:absolute;top:-24px;left:50%;transform:translateX(-50%)}
.login .lock .badge{width:46px;height:46px;border-radius:15px}
.login .lock svg.i{width:24px;height:24px}
label{display:flex;flex-direction:column;gap:5px;font:800 13px var(--disp);color:var(--muted);letter-spacing:.2px}
input,select,textarea{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:9px 13px;min-height:46px;font-weight:800;width:100%;box-shadow:inset 0 3px 0 rgba(22,34,74,.06)}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2f8fe0;box-shadow:0 0 0 4px rgba(58,168,255,.28)}
input:disabled,select:disabled{background:#f1f3f9;color:#8a93a8}
textarea{min-height:84px;resize:vertical}
.otp{font:800 32px/1 var(--disp);letter-spacing:12px;text-align:center;padding-left:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 18px;border:3px solid var(--ink);border-radius:15px;color:var(--ink);background:linear-gradient(#fff3b0,#ffd23f 50%,#ff9f1c);box-shadow:0 4px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.55);font:800 16px var(--disp);cursor:pointer;white-space:nowrap;transition:transform .06s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn.green{background:linear-gradient(#c9ffd9,#5fdc8c 50%,#2fb763);color:#0d3a1f}
.btn.red{background:linear-gradient(#ffc2c9,#ff7a88 50%,#e8475a);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.sky{background:linear-gradient(#fff,#d9ecff)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-width:2.5px;border-radius:12px;box-shadow:0 3px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.big{min-height:54px;font-size:19px}
.err{color:#c0143f;font-weight:900;min-height:1.2em;text-align:center}
.note{color:var(--muted);font-size:13.5px;font-weight:700}
.login .note{text-align:center}
.qr{display:grid;place-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px;box-shadow:0 4px 0 var(--ink)}
.qr img{width:190px;height:190px;image-rendering:pixelated}
.mono{font-family:ui-monospace,Consolas,monospace;font-weight:700;word-break:break-all}
.secret{background:#fff3c4;border:3px dashed var(--ink);border-radius:14px;padding:10px;font:800 20px var(--disp);text-align:center;letter-spacing:1px}
.steps{display:flex;gap:8px;justify-content:center}
.steps span{width:28px;height:8px;border-radius:9px;background:#d5dbe9;border:2px solid var(--ink)}
.steps span.on{background:var(--sun)}
/* khung chính */
.app{position:relative;display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(255,250,240,.98),rgba(255,244,214,.98));border-right:4px solid var(--ink);box-shadow:6px 0 0 rgba(22,34,74,.25)}
.side .logo{margin:4px 0 16px}
.nav{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:14px;color:var(--ink);font:800 16px var(--disp);cursor:pointer;border:3px solid transparent;background:none;text-align:left}
@media (hover:hover){.nav:hover{background:rgba(255,210,63,.25)}}
.nav.on{background:#fff;border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.nav .badge{width:32px;height:32px;border-radius:10px;border-width:2.5px;box-shadow:0 2px 0 var(--ink)}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--ink)}
.who>div{min-width:0}
.who b{display:block;font:800 15px var(--disp);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--muted);font-weight:800}
.who .btn{margin-left:auto;min-height:34px;padding:0 8px;flex:none}
main{padding:22px clamp(12px,2.6vw,30px) 70px;min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.top h1{display:flex;align-items:center;gap:12px;font-size:clamp(26px,3.4vw,36px);color:#fff;text-shadow:0 3px 0 var(--ink),0 0 1px var(--ink);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.top h1 .badge{width:44px;height:44px;border-radius:14px;-webkit-text-stroke:0}
.top h1 .badge svg.i{width:22px;height:22px}
.top .sp{flex:1}
.topr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn.mob{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;border:3px solid var(--ink);background:#fff;font:800 13px var(--disp);box-shadow:0 3px 0 var(--ink);color:var(--ink)}
.grid{display:grid;gap:18px}
.grid>*,.card{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.tile{position:relative;display:flex;align-items:center;gap:12px;background:rgba(255,250,240,.97);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:12px 14px}
.tile .badge{width:44px;height:44px;border-radius:14px}
.tile .badge svg.i{width:22px;height:22px}
.tile .v{font:800 30px/1 var(--disp)}
.tile .k{font:800 12.5px/1.2 var(--disp);color:var(--muted);margin-top:3px}
.tile.hot{background:linear-gradient(#fff6c8,#ffe08a)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;font-weight:700}
th{text-align:left;font:800 13px var(--disp);color:var(--muted);padding:8px 10px;border-bottom:3px solid var(--ink);white-space:nowrap}
td{padding:9px 10px;border-bottom:2px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:rgba(232,242,255,.45)}
tr.click{cursor:pointer}tr.click:hover td{background:#fff3c4}
.scroll{overflow:auto;max-width:100%;border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 10px;border-radius:99px;border:2.5px solid var(--ink);font:800 12.5px var(--disp);background:#fff;white-space:nowrap;color:var(--ink)}
.pill.on{background:#c9ffd9}.pill.off{background:#ffd1d6}.pill.warn{background:#ffe08a}.pill.blue{background:#d9ecff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>label{flex:1 1 150px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.item{background:#fff;border:3px solid var(--line);border-radius:14px;padding:9px 11px;font-size:13.5px;display:flex;flex-direction:column;gap:3px;box-shadow:0 3px 0 rgba(22,34,74,.12)}
.item b{font:800 15px var(--disp)}
.r0{border-color:#9aa6bd}.r1{border-color:#3b82f6;background:#f3f8ff}.r2{border-color:#a855f7;background:#faf5ff}.r3{border-color:#f59e0b;background:#fff8e0}
.chart{width:100%;height:170px;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:var(--ink);border:3px solid var(--ink);padding:12px 20px;border-radius:16px;font:800 16px var(--disp);box-shadow:0 5px 0 var(--ink),0 14px 30px rgba(0,0,0,.3);z-index:50;max-width:92vw;animation:pop .2s ease-out}
.toast.bad{background:#ffd1d6}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(10,18,45,.62);display:grid;place-items:center;padding:16px;z-index:40}
.modal .card{width:min(480px,100%);display:flex;flex-direction:column;gap:12px}
.sub{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.kv span:nth-child(odd){color:var(--muted);font-weight:900}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
@media (max-width:860px){
  body.in::before{background:linear-gradient(rgba(14,24,58,.78),rgba(14,24,58,.86)),#14204a url(tai-game-bg.webp) center 62%/cover no-repeat}
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-content:start}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;z-index:5;border-right:0;border-bottom:4px solid var(--ink);padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));box-shadow:0 4px 0 rgba(22,34,74,.25)}
  .side::-webkit-scrollbar{display:none}
  .side .logo,.who{display:none}
  .nav{flex:none;align-self:center;height:auto;padding:5px 10px;font-size:14.5px;border-width:2.5px}
  .nav.on{box-shadow:0 3px 0 var(--ink)}
  .nav .badge{width:28px;height:28px}
  main{padding:16px 12px 60px}
  .logo .l1{--sw:9px}.logo .l2{--sw:8px}
  .top{gap:10px}
  .btn.mob{display:inline-flex}
  .topr{width:100%;justify-content:space-between}
  .g2{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .tile .v{font-size:24px}
}

.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gi{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 8px 12px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);color:var(--ink);font:inherit;min-width:0}
button.gi{cursor:pointer}button.gi:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.gi img{width:64px;height:64px;object-fit:contain;image-rendering:auto}.gi .badge{width:64px;height:64px;border-radius:16px}.gi .badge .i{width:34px;height:34px}
.gi b{font:800 15px/1.2 var(--disp)}.gi span{font-size:12.5px;line-height:1.3}.gi input{min-height:40px;text-align:center}
.gi.r1{background:linear-gradient(#fff,#e9f1ff)}.gi.r2{background:linear-gradient(#fff,#f3e8ff)}.gi.r3{background:linear-gradient(#fff,#fff1cc)}
.gi.sel{background:linear-gradient(#e6fff2,#b9f3d6);outline:3px solid var(--mint);outline-offset:2px}
.gi .plus{position:absolute;top:6px;right:6px;width:26px;height:26px;display:grid;place-items:center;border-radius:9px;background:var(--sun);border:2px solid var(--ink)}.gi .plus .i{width:16px;height:16px}
.chk{display:inline-flex;flex-direction:row;align-self:flex-end;min-height:46px;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}.chk input{width:20px;height:20px;min-height:0;padding:0;box-shadow:none;accent-color:var(--mint)}
.cart-row{display:flex;gap:12px;align-items:flex-start;padding:12px;margin-top:10px;background:#fff;border:3px solid var(--ink);border-radius:16px}
.cart-row>img{width:56px;height:56px;object-fit:contain;flex:none}.cart-row .grow{flex:1;min-width:0;display:grid;gap:6px}
.cart-row .row label{flex:0 1 auto}.cart-row .row input[type=number]{width:96px}.cart-row select{width:auto}
@media(max-width:640px){.cat{grid-template-columns:repeat(2,minmax(0,1fr))}.cart-row{flex-wrap:wrap}.cart-row .grow{flex-basis:calc(100% - 70px)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="admin-qr.js"></script>
<script src="admin-app.js"></script>
</body>
</html>
